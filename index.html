<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="_5JTuo4SCAJzuH32k4xzd_6UOuGHT_6bavh5RhZL-TI" />
    <meta charset="UTF-8">

    <title>Areshy Creation Studio | Bespoke Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #C5A059; 
            --royal-blue: #002366; 
            --deep-blue: #050a14;
            --white: #ffffff;
            --soft-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        body { font-family: 'Montserrat', sans-serif; margin: 0; background: #fcfcfc; color: var(--deep-blue); -webkit-font-smoothing: antialiased; }

        /* LUXURY HEADER */
        header { 
            padding: 20px; text-align: center; background: var(--deep-blue);
            position: sticky; top: 0; z-index: 1000; border-bottom: 3px solid var(--gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .brand-name { font-family: 'Cinzel', serif; font-size: 30px; color: var(--gold); letter-spacing: 10px; margin: 0; font-weight: 700; }
        .brand-sub { font-size: 9px; letter-spacing: 5px; color: var(--white); text-transform: uppercase; margin-top: 5px; opacity: 0.9; }

        /* OPTIMIZED SLIDER */
        .hero { position: relative; height: 60vh; overflow: hidden; background: var(--deep-blue); }
        .slides { display: flex; width: 300%; height: 100%; animation: kenburns 12s infinite alternate ease-in-out; }
        .slides img { width: 33.33%; height: 100%; object-fit: cover; opacity: 0.55; }

        @keyframes kenburns {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .hero-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; z-index: 5; width: 100%;
        }
        .hero-content h1 { font-family: 'Cinzel', serif; font-size: clamp(24px, 8vw, 45px); color: var(--gold); margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero-content p { letter-spacing: 4px; text-transform: uppercase; font-size: 10px; margin-top: 15px; font-weight: 400; }

        /* PRODUCT GRID */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 35px; }
        
        .card { 
            background: white; border: 1px solid #f0f0f0; transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1); 
            overflow: hidden; border-radius: 2px;
        }
        .card:hover { transform: translateY(-12px); border-color: var(--gold); box-shadow: var(--soft-shadow); }

        .img-container { aspect-ratio: 1/1; overflow: hidden; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 1.2s ease; }
        .card:hover img { transform: scale(1.1); }

        .info { padding: 25px; text-align: center; }
        .info h3 { font-size: 13px; letter-spacing: 1.5px; margin-bottom: 20px; height: 35px; font-weight: 400; color: #333; text-transform: uppercase; }
        
        /* MODERN BUTTON */
        .buy-btn { 
            display: block; background: var(--royal-blue); color: var(--gold); 
            padding: 14px; text-decoration: none; font-size: 11px; font-weight: 700;
            border: 1px solid var(--gold); text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.4s ease;
        }
        .buy-btn:hover { background: var(--gold); color: white; letter-spacing: 3px; }

        /* LUXURY FOOTER */
        footer { 
            background: var(--deep-blue); color: var(--white); 
            padding: 50px 20px; text-align: center; border-top: 5px solid var(--gold);
        }
        .footer-logo { font-family: 'Cinzel', serif; color: var(--gold); font-size: 26px; letter-spacing: 5px; margin-bottom: 20px; }
        
        .dev-credit { font-size: 12px; margin: 25px 0; color: #aaa; letter-spacing: 2px; }
        .dev-credit span { color: var(--gold); font-weight: 600; text-decoration: underline; }
        
        .copyright { font-size: 9px; margin-top: 35px; color: #666; letter-spacing: 2px; border-top: 1px solid #1a1a1a; padding-top: 25px; }
        
        /* WHATSAPP FLOAT */
        .float-wa { 
            position: fixed; bottom: 30px; right: 30px; 
            background: #25D366; color: white; padding: 16px 28px; 
            border-radius: 50px; text-decoration: none; z-index: 2000; font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25); font-size: 12px; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
        }
        .float-wa:hover { transform: scale(1.05); }
    </style>
</head>
<body>
