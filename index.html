<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #C5A059; 
            --black: #0a0a0a; 
            --white: #ffffff;
            --soft-gold: rgba(197, 160, 89, 0.1);
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; 
            background: #fafafa; 
            color: var(--black); 
            overflow-x: hidden; 
        }

        /* Luxury Navigation */
        header { 
            padding: 40px 20px; 
            text-align: center; 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 1px solid var(--soft-gold);
        }

        .brand-name { 
            font-family: 'Cinzel', serif; 
            font-size: clamp(24px, 5vw, 42px); 
            color: var(--black); 
            text-transform: uppercase; 
            letter-spacing: 8px; 
            margin: 0;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--gold);
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* International Slider */
        .hero {
            position: relative;
            height: 85vh;
            overflow: hidden;
            background: var(--black);
        }

        .slides {
            display: flex;
            width: 400%;
            height: 100%;
            animation: kenburns 20s infinite alternate;
        }

        .slides img {
            width: 25%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        @keyframes kenburns {
            0% { transform: scale(1) translateX(0); }
            100% { transform: scale(1.1) translateX(-5%); }
        }

        .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 5;
        }

        .hero-content h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(30px, 6vw, 60px);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--gold);
            display: inline-block;
            padding-bottom: 10px;
        }

        /* Floating Luxury WhatsApp */
        .float-wa { 
            position: fixed; 
            bottom: 40px; 
            right: 40px; 
            background: var(--black); 
            color: var(--gold); 
            padding: 18px 25px; 
            border: 1px solid var(--gold);
            text-decoration: none; 
            z-index: 2000; 
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.4s;
        }

        .float-wa:hover {
            background: var(--gold);
            color: white;
        }

        /* Elegant Grid */
        .container { max-width: 1400px; margin: 80px auto; padding: 0 40px; }
        
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 { font-family: 'Cinzel', serif; font-size: 32px; letter-spacing: 4px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 50px; 
        }

        .card { 
            background: transparent; 
            transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
        }

        .img-container {
            overflow: hidden;
            position: relative;
            aspect-ratio: 1/1.2;
        }

        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 1s ease;
        }

        .card:hover img { transform: scale(1.08); }

        .info { 
            padding: 25px 0; 
            text-align: left; 
            border-bottom: 1px solid #eee;
          }

        .info h3 { 
            font-size: 14px; 
            margin: 0; 
            font-weight: 400; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: #333;
        }
        
        .buy-btn { 
            display: inline-block; 
            margin-top: 15px;
            color: var(--gold); 
            text-decoration: none; 
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .buy-btn::after {
            content: ' →';
            transition: 0.3s;
        }

        .buy-btn:hover::after { padding-left: 10px; }

        footer { 
            background: #000; 
            color: #777; 
            padding: 80px 20px; 
            text-align: center; 
        }

        .footer-logo { font-family: 'Cinzel', serif; color: var(--white); font-size: 24px; letter-spacing: 5px; margin-bottom: 20px; }
        .copyright { font-size: 10px; letter-spacing: 2px; margin-top: 40px; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
